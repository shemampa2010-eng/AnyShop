<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement - AnyShop Store</title>
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <div id="head"></div>

    <main style="max-width: 800px; margin: 20px auto; padding: 0 20px;">
        <h1>Validation de la commande</h1>

        <!-- Boîte invisible qui s'affichera après le paiement -->
        <div id="successMessage" style="display: none; background: #d4edda; color: #155724; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center;"></div>

        <div style="display: flex; gap: 40px; flex-wrap: wrap;">
            
            <!-- Formulaire d'informations -->
            <form id="checkoutForm" style="flex: 1; min-width: 300px;">
                <h3>Vos coordonnées</h3>
                
                <p>
                    <label for="name">Nom complet :</label><br>
                    <input type="text" id="name" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                </p>
                <p>
                    <label for="email">Email :</label><br>
                    <input type="email" id="email" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                </p>
                <p>
                    <label for="address">Adresse de livraison :</label><br>
                    <input type="text" id="address" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                </p>
                
                <h3>Paiement simulé</h3>
                <p>
                    <select id="paymentMethod" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        <option value="card">Carte bancaire (Simulé)</option>
                        <option value="paypal">PayPal (Simulé)</option>
                    </select>
                </p>

                <button type="submit" id="Payer" style="padding: 12px 20px; background: green; color: white; border: none; cursor: pointer; width: 100%;">
                    Payer maintenant
                </button>
            </form>

            <div style="flex: 1; min-width: 250px; background: #f9f9f9; padding: 20px; border-radius: 8px; align-self: flex-start;">
                <h3>Résumé</h3>
                <div id="orderSummary"></div>
                <hr>
                <p>Sous-total : <strong id="subtotal">$0.00</strong></p>
                <p>Livraison : <strong>$5.00</strong></p>
                <h2>Total : <strong id="finalTotal">$0.00</strong></h2>
            </div>

        </div>
    </main>

    <!-- Conteneur du footer -->
    <footer id="footer"></footer>

    <!-- Scripts JS chargés proprement -->
    <script src="clothes.js" defer></script>
    <script src="nav.js" defer></script>
    <script src="payment.js" defer></script>
    <script src="footer.js" defer></script>
</body>
</html>
